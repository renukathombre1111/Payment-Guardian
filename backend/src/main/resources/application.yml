spring.application.name=payment-guardian
server.port=8080

spring.datasource.url=jdbc:h2:mem:paymentguardian;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

guardian.openai.api-key=${OPENAI_API_KEY:}
guardian.openai.model=${OPENAI_MODEL:gpt-4o-mini}
guardian.company-name=NovaTech Pvt Ltd
guardian.safety-buffer=2500000

guardian.policy.max-payment-without-approval=500000
guardian.policy.bank-cooling-hours=24
guardian.policy.new-vendor-max-payment=200000
guardian.policy.min-cash-buffer=2500000
guardian.policy.invoice-required=true
---
spring.config.activate.on-profile=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentguardian
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=guardian
spring.datasource.password=guardian
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
